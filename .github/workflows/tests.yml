name: Tests

on:
  pull_request:
    branches: [development, main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The core library carries the native module, so it comes from PyPI (a Windows wheel per Python). Until a release of
      # in-reach that has the API this IDE needs is published, this job can't pass -- release in-reach first.
      - name: Install the package and its test dependencies
        run: python -m pip install -e ".[dev]"
      # Not QT_QPA_PLATFORM=offscreen: that platform has no emoji font, and several icon tests need to draw one.
      - name: Run tests
        run: python -m pytest -q
